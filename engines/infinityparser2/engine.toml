# Infinity-Parser2-Flash page-image layout parser (README.md next to this file; format:
# docs/RUNNER.md). Run with --cache <dir> holding the weights from make infinityparser2-model.
name = "infinityparser2"
engine_version = "1"
image = "ocrbench/engine-infinityparser2:flash-v1"
model = "infly/Infinity-Parser2-Flash@cfddc4106b0abc4706f05575a164f7dd35d09c46"

[params]
device = "cuda:0"
max_new_tokens = 32768  # other parameters: README.md

[resources]
cpus = 4
memory = "16g"
gpus = "all"
shm_size = "2g"

[timeouts]
sample = 2400
startup = 300
