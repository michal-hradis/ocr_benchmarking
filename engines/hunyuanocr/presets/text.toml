# HunyuanOCR-1.5 page-image to text model, preset text (../README.md; format: docs/RUNNER.md).
# Run with --cache <dir> holding the weights from make hunyuanocr-model.
name = "hunyuanocr-text"
engine_version = "1"
image = "ocrbench/engine-hunyuanocr:1.5-v1"
model = "tencent/HunyuanOCR@47644ecc4fc854efa4f505155158831f36773ee4"

[params]
device = "cuda:0"
task = "structured_parse"  # the official "extract the text in the image" prompt (README.md)
max_new_tokens = 32768

[resources]
cpus = 4
memory = "16g"
gpus = "all"
shm_size = "2g"

[timeouts]
sample = 1800
startup = 300
