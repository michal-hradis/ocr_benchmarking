# GLM-OCR 0.9B compact page OCR model, whole page, text recognition (README.md next to this file;
# format: docs/RUNNER.md). Run with --cache <dir> holding the weights from make glm-ocr-model.
name = "glm-ocr"
engine_version = "1"
image = "ocrbench/engine-glm-ocr:0.9B-v1"
model = "zai-org/GLM-OCR@2e85a62840ccac27daa451df36c736c4636b8628"

[params]
device = "cuda:0"
max_new_tokens = 8192  # other parameters: README.md

[resources]
cpus = 4
memory = "16g"
gpus = "all"
shm_size = "2g"

[timeouts]
sample = 900
startup = 300
