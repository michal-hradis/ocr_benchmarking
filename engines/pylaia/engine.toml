# PyLaia CNN-RNN-CTC line recognition on Kraken page segmentation (README.md next to this file;
# format: docs/RUNNER.md).
name = "pylaia"
engine_version = "1"
image = "ocrbench/engine-pylaia:1.1.2-v1"
model = "blla+pylaia-newseye-austrian@5361aa77db34d23cb23b27194c7c095f01f5ea54"  # segmentation + recognition

[params]
device = "cuda:0"  # "cpu" also needs resources.gpus removed (README.md)
recognition_model = "newseye-austrian"  # other parameters: README.md

[resources]
cpus = 4
memory = "16g"
gpus = "all"
shm_size = "2g"

[timeouts]
sample = 600
startup = 300
