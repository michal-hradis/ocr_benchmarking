# LightOnOCR-3-1B, plain mode: the image alone, Markdown of the whole page without positions (converted to text on the host).
# One request per page as LightOn's client sends it (README.md next to engine.toml; format: docs/RUNNER.md).
# Run with --cache <dir> holding the weights from make lightonocr3-model.
name = "lightonocr3-1b-plain"
engine_version = "1"
image = "ocrbench/engine-lightonocr3:3-v1"
model = "lightonai/LightOnOCR-3-1B@23d544085c886bbdace647bcfab91203299417e2"

[params]
checkpoint = "1B"
mode = "plain"
device = "cuda:0"
# max_tokens is left out: generation runs to the end token or the end of the context, as LightOn's
# client; other parameters: README.md
# Share of GPU memory for vLLM (weights, CUDA graphs and KV cache), at most 0.6 (ADR 0012).
gpu_memory_utilization = 0.6

[resources]
cpus = 4
memory = "24g"
gpus = "all"
shm_size = "4g"

[timeouts]
sample = 1200
startup = 1200
